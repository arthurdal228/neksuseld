<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEKSUS Control</title><style>
:root{--bg:#09110d;--panel:#101a14;--panel2:#152119;--line:#26362b;--text:#f2f7f3;--muted:#8ea096;--green:#b6f86b;--green2:#68d69b;--red:#f07d7a;--amber:#e8be65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.login-card{width:min(390px,100%);padding:24px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.mark{width:39px;height:39px;border-radius:11px;background:var(--green);color:#13210e;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:9px;color:var(--muted);margin:2px 0 0;text-transform:uppercase;letter-spacing:1.5px}.field{margin-top:12px}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;height:41px;border:1px solid var(--line);border-radius:9px;background:#0b130e;color:var(--text);padding:0 11px;outline:none}.field input:focus,.field select:focus{border-color:var(--green2)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:700;font-size:10px;cursor:pointer}.btn.primary{background:var(--green);color:#15210f;border-color:var(--green)}.btn.danger{color:var(--red)}.login-card .btn{width:100%;margin-top:15px;height:42px}.error{font-size:10px;color:var(--red);min-height:16px;margin-top:10px}.app{min-height:100vh}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;background:#09110df2;backdrop-filter:blur(12px);z-index:10}.top .brand{margin:0;flex:1}.user{font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 60px)}.side{border-right:1px solid var(--line);padding:14px 10px}.nav{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font-size:10px;margin-bottom:4px;cursor:pointer}.nav.active{color:var(--text);background:var(--panel2)}.main{padding:20px;max-width:1250px;width:100%;margin:0 auto}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.heading h2{margin:0;font-size:21px}.heading p{font-size:10px;color:var(--muted);margin:3px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{padding:14px}.stat span{font-size:8px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}.stat b{display:block;font-size:22px;margin-top:4px}.panel{padding:0;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #1d2b22}th{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.7px}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:8px}.badge.green{color:var(--green2)}.badge.amber{color:var(--amber)}.badge.red{color:var(--red)}.row-actions{display:flex;gap:5px}.row-actions .btn{padding:6px 8px}.companies{display:flex;gap:4px;flex-wrap:wrap}.company-chip{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:#c7d2ca}.modal-bg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;padding:19px}.modal h3{margin:0 0 4px}.modal .sub{font-size:9px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.check{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:9px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.activity{display:flex;flex-direction:column}.activity-row{padding:11px 14px;border-bottom:1px solid #1d2b22;display:grid;grid-template-columns:140px 130px 1fr;gap:12px;font-size:9px}.activity-row span{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav{width:auto;white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.grid2,.check-grid{grid-template-columns:1fr}.activity-row{grid-template-columns:1fr}.main{padding:14px}}
</style></head><body>
<section id="login" class="login"><div class="card login-card"><div class="brand"><div class="mark">N</div><div><h1>NEKSUS Control</h1><p>Access management</p></div></div><form id="loginForm"><div class="field"><label>Username</label><input name="username" autocomplete="username" autofocus required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary">Login</button><div id="loginError" class="error"></div></form></div></section>
<section id="app" class="app hidden"><header class="top"><div class="brand"><div class="mark">N</div><div><h1>NEKSUS Control</h1><p>Monitoring & access</p></div></div><div id="who" class="user"></div><button id="logout" class="btn">Sign out</button></header><div class="layout"><aside class="side"><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="users">Users</button><button class="nav" data-page="companies">Companies</button><button class="nav" data-page="activity">Activity</button></aside><main class="main"><div id="view"></div></main></div></section><div id="modal"></div>
<script>
const API='https://neksuseldv1.onrender.com';let token=sessionStorage.getItem('neksus_control_session')||'',me=null,users=[],companies=[],activity=[],page='dashboard';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Accept':'application/json','Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opt.headers||{})},cache:'no-store'});const text=await r.text();let body={};try{body=text?JSON.parse(text):{}}catch{body={}}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}function showLogin(msg=''){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent=msg}async function boot(){try{const m=await req('/v1/control/me');me=m.user;if(me.role!=='super_admin')throw new Error('Super admin access required');$('who').textContent=me.full_name||me.username;$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadAll();render()}catch(e){token='';sessionStorage.removeItem('neksus_control_session');showLogin(e.message)}}async function loadAll(){const [u,c,a]=await Promise.all([req('/v1/control/users'),req('/v1/control/companies'),req('/v1/control/activity')]);users=u.users||[];companies=c.companies||[];activity=a.activity||[]}function roleBadge(r){return `<span class="badge ${r==='super_admin'?'green':r==='manager'?'amber':''}">${esc(r.replace('_',' '))}</span>`}function companyNames(u){if(u.all_companies)return '<span class="company-chip">All companies</span>';const map=new Map(companies.map(c=>[c.id,c.name]));const arr=(u.company_ids||[]).map(id=>map.get(id)).filter(Boolean);return arr.length?arr.map(x=>`<span class="company-chip">${esc(x)}</span>`).join(''):'<span class="company-chip">No companies</span>'}function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(page==='dashboard')return renderDashboard();if(page==='users')return renderUsers();if(page==='companies')return renderCompanies();renderActivity()}function renderDashboard(){const active=users.filter(u=>u.active).length,online=users.filter(u=>u.online).length;$('view').innerHTML=`<div class="heading"><div><h2>Control Center</h2><p>Manage who can access NEKSUS ELD and which companies they can see.</p></div><button class="btn primary" data-action="new-user">+ New user</button></div><div class="stats"><div class="card stat"><span>Users</span><b>${users.length}</b></div><div class="card stat"><span>Active</span><b>${active}</b></div><div class="card stat"><span>Companies</span><b>${companies.length}</b></div><div class="card stat"><span>Online now</span><b>${online}</b></div></div><div class="card panel"><div class="panel-head"><h3>Users</h3></div>${userTable(users.slice(0,8))}</div>`}function userTable(list){return `<div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Companies</th><th>Status</th><th>Session</th><th>Last login</th><th></th></tr></thead><tbody>${list.map(u=>`<tr><td><strong>${esc(u.full_name||u.username)}</strong><br><span style="color:var(--muted)">${esc(u.username)}</span></td><td>${roleBadge(u.role)}</td><td><div class="companies">${companyNames(u)}</div></td><td><span class="badge ${u.active?'green':'red'}">${u.active?'Active':'Disabled'}</span></td><td><span class="badge ${u.online?'green':''}">${u.online?'Online':'Offline'}</span></td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString():'Never'}</td><td><div class="row-actions"><button class="btn" data-action="edit-user" data-id="${u.id}">Edit</button></div></td></tr>`).join('')}</tbody></table></div>`}function renderUsers(){$('view').innerHTML=`<div class="heading"><div><h2>Users</h2><p>Accounts used to log into the NEKSUS ELD website.</p></div><button class="btn primary" data-action="new-user">+ New user</button></div><div class="card panel">${userTable(users)}</div>`}function renderCompanies(){$('view').innerHTML=`<div class="heading"><div><h2>Companies</h2><p>Companies already configured in NEKSUS ELD.</p></div></div><div class="card panel"><div class="table-wrap"><table><thead><tr><th>Company</th><th>USDOT</th><th>Drivers</th><th>Assigned users</th></tr></thead><tbody>${companies.map(c=>{const count=users.filter(u=>u.all_companies||(u.company_ids||[]).includes(c.id)).length;return `<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.usdot)}</td><td>${c.driver_count}</td><td>${count}</td></tr>`}).join('')}</tbody></table></div></div>`}function renderActivity(){$('view').innerHTML=`<div class="heading"><div><h2>Activity</h2><p>Recent access-management and login activity.</p></div></div><div class="card activity">${activity.length?activity.map(a=>`<div class="activity-row"><span>${new Date(a.created_at).toLocaleString()}</span><strong>${esc(a.username||'System')}</strong><div>${esc(a.action)}${a.company?' · '+esc(a.company):''}${a.driver_id?' · '+esc(a.driver_id):''}</div></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`}function userModal(u=null){const edit=!!u,selected=new Set(u?.company_ids||[]);$('modal').innerHTML=`<div class="modal-bg"><form id="userForm" class="card modal" data-id="${u?.id||''}"><h3>${edit?'Edit user':'Create user'}</h3><p class="sub">Assign a role and the companies this account can access in NEKSUS ELD.</p><div class="grid2"><div class="field"><label>Username</label><input name="username" ${edit?'disabled':''} value="${esc(u?.username||'')}" required></div><div class="field"><label>Full name</label><input name="full_name" value="${esc(u?.full_name||'')}"></div><div class="field"><label>${edit?'New password (optional)':'Password'}</label><input name="password" type="password" ${edit?'':'required'}></div><div class="field"><label>Role</label><select name="role"><option value="operator">Operator</option><option value="viewer">Viewer</option><option value="manager">Manager</option><option value="super_admin">Super Admin</option></select></div></div><div class="field"><label><input type="checkbox" name="all_companies" ${u?.all_companies?'checked':''}> Access all companies</label></div><div class="field"><label>Assigned companies</label><div class="check-grid">${companies.map(c=>`<label class="check"><input type="checkbox" name="company" value="${c.id}" ${selected.has(c.id)?'checked':''}> ${esc(c.name)} <span style="color:var(--muted)">${esc(c.usdot)}</span></label>`).join('')}</div></div>${edit?`<div class="field"><label><input type="checkbox" name="active" ${u.active?'checked':''}> Account active</label></div>`:''}<div id="modalError" class="error"></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">${edit?'Save changes':'Create user'}</button></div></form></div>`;const f=$('userForm');f.elements.role.value=u?.role||'operator';f.onsubmit=saveUser}async function saveUser(e){e.preventDefault();const f=e.target,fd=new FormData(f),id=f.dataset.id,company_ids=fd.getAll('company'),body={full_name:String(fd.get('full_name')||''),role:String(fd.get('role')||'operator'),all_companies:fd.get('all_companies')==='on',company_ids};const password=String(fd.get('password')||'');if(password)body.password=password;if(!id){body.username=String(fd.get('username')||'');if(!password){$('modalError').textContent='Password is required.';return}}else body.active=fd.get('active')==='on';try{if(id)await req('/v1/control/users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});else await req('/v1/control/users',{method:'POST',body:JSON.stringify(body)});$('modal').innerHTML='';await loadAll();render()}catch(err){$('modalError').textContent=err.message}}document.addEventListener('click',e=>{const nav=e.target.closest('.nav');if(nav){page=nav.dataset.page;render();return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='new-user')userModal();if(b.dataset.action==='edit-user')userModal(users.find(u=>u.id===b.dataset.id));if(b.dataset.action==='close-modal')$('modal').innerHTML='' });$('loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const body=await req('/v1/control/login',{method:'POST',body:JSON.stringify({username:String(fd.get('username')||''),password:String(fd.get('password')||'')})});token=body.token;sessionStorage.setItem('neksus_control_session',token);await boot()}catch(err){$('loginError').textContent=err.message}};$('logout').onclick=async()=>{try{await req('/v1/control/logout',{method:'POST'})}catch{}token='';sessionStorage.removeItem('neksus_control_session');showLogin()};if(token)boot();else showLogin();
</script></body></html>
