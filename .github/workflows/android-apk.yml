name: NEKSUS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-driver/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android-driver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle
        run: gradle --version

      - name: Build NEKSUS APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEKSUS-Driver-debug
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
